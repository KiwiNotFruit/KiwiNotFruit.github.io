<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Killing Floor 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background: linear-gradient(135deg, #000000 0%, #1a0000 55%, #8b0000 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #111111;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.35);
            padding: 40px;
            border: 1px solid #2a2a2a;
        }
        
        h1 {
            color: #ff2b2b;
            margin-bottom: 20px;
            text-align: center;
        }
        
        p {
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
        }
        
        .content-section {
            margin-top: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-left: 4px solid #ff2b2b;
            border-radius: 5px;
        }
        
        .content-section h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        .explore-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .explore-links a {
            display: inline-block;
            padding: 15px 30px;
            background: #ff2b2b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .explore-links a:hover {
            background: #c40000;
        }

        .explore-links a.explore {
            background: #ff2b2b;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
            color: #cccccc;
            font-size: 14px;
        }
        
        .quick-links { margin-top: 18px; display:flex;gap:12px;justify-content:center;flex-wrap:wrap }
        .quick-links a { background:#111;color:#ffffff;border:1px solid #333;padding:8px 12px;border-radius:6px;text-decoration:none }
        .quick-links a:hover { background:#1a1a1a }
    </style>
</head>
<body>
    <div class="container">
        <h1>Killing Floor 3</h1>
        <p>Welcome to the Killing Floor 3 repository.</p>
        
        <div class="content-section">
            <h2>About This Site</h2>
            <p>This site contains data and information related to Killing Floor 3.</p>
        </div>
        
        <div class="content-section">
            <h2>Explore</h2>
            <p>Browse our collection of game information:</p>
            <div class="explore-links">
                <a href="./explore/" class="data">Explore</a>
            </div>

            <p style="margin-top: 15px; font-size: 14px; color: #cccccc;">
                <strong>Explore data:</strong> Game data organized in separate sections<br>
            </p>
        </div>
        
        <footer>
            <p>Discord for more: #####</p>
        </footer>
    </div>
</body>
</html>
