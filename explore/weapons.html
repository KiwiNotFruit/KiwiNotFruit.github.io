<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weapons — Data</title>
  <link rel="stylesheet" href="weapons.css">
</head>
<body>
  <main class="wrapper">
    <h1>Weapons</h1>

    <div class="controls">
      <input id="search" type="search" placeholder="Search weapons by name..." aria-label="Search weapons by name">
    </div>
    <nav class="class-links" aria-label="Weapon classes">
      <a href="#class=Commando" data-class="Commando">Commando</a>
      <a href="#class=Engineer" data-class="Engineer">Engineer</a>
      <a href="#class=Sharpshooter" data-class="Sharpshooter">Sharpshooter</a>
      <a href="#class=Gunslinger" data-class="Gunslinger">Gunslinger</a>
      <a href="#class=Firebug" data-class="Firebug">Firebug</a>
      <a href="#class=Field%20Medic" data-class="Field Medic">Field Medic</a>
      <a href="#class=Ninja" data-class="Ninja">Ninja</a>
    </nav>

    <div id="list" class="weapon-list" aria-live="polite"></div>

    <nav class="pagination" aria-label="Weapons pages">
      <button id="prevPage" class="page-btn">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage" class="page-btn">Next</button>
    </nav>
  </main>

  <!-- Simple popover container (reused for hover/click details) -->
  <div id="popover" class="popover" role="dialog" aria-hidden="true"></div>

  <script src="weapons.js"></script>
</body>
</html>
