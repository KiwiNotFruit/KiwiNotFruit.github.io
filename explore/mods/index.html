<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mods — Data (Index)</title>
  <link rel="stylesheet" href="../weapons.css">
  <style>
    :root {
      --bg: #000;
      --bg-alt: #111;
      --panel: #171717;
      --text: #fff;
      --muted: #cfcfcf;
      --accent: #ff2b2b;
      --border: #2a2a2a;
    }
    body { background: linear-gradient(135deg, var(--bg) 0%, #1a0000 55%, #8b0000 100%); color: var(--text); }
    .wrapper { background: var(--bg-alt); border: 1px solid var(--border); color: var(--text); }
    h1 { color: var(--accent); }
    .controls, .weapon-card, .weapon-list { color: var(--text); }
    input, select {
      background: #0f0f0f;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .page-btn, button, a {
      color: var(--text);
    }
    .weapon-card { background: var(--panel); border-color: var(--border); }
    .weapon-title h2 { color: var(--accent); }
    .weapon-desc { color: var(--muted); }
    .weapon-price { color: var(--accent) !important; }
    .stat, .small-link { color: var(--muted) !important; }
    a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrapper">
    <h1>Mods</h1>

    <div class="controls">
      <input id="search" type="search" placeholder="Search mods by name or description..." aria-label="Search mods">
      <label for="perPage">Per page:</label>
      <select id="perPage" aria-label="Mods per page">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <div id="list" class="weapon-list" aria-live="polite"></div>

    <nav class="pagination" aria-label="Mods pages">
      <button id="prevPage" class="page-btn">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage" class="page-btn">Next</button>
    </nav>
  </main>

  <script src="../mods.js"></script>
</body>
</html>
