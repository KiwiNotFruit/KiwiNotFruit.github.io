<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mods — Data</title>
  <link rel="stylesheet" href="weapons.css">
</head>
<body>
  <main class="wrapper">
    <h1>Mods</h1>

    <div class="controls">
      <input id="search" type="search" placeholder="Search mods by name or description..." aria-label="Search mods">
      <label for="perPage">Per page:</label>
      <select id="perPage" aria-label="Mods per page">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <div id="list" class="weapon-list" aria-live="polite"></div>

    <nav class="pagination" aria-label="Mods pages">
      <button id="prevPage" class="page-btn">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage" class="page-btn">Next</button>
    </nav>
  </main>

  <script src="mods.js"></script>
</body>
</html>
